; Wi-Fi canary: a spare ESP32 that probes the internet from the HOME router's 2.4 GHz Wi-Fi and reports by UDP to audire-videre.
; Wi-Fi credentials are NOT in this file: scripts/secrets.py injects them from ~/esp32-tools/wifi.secret at build time.
; Isolated from ../magi-esp so the mesh/sense builds are never affected.
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/secrets.py
build_src_filter = +<*>
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=0

[env:canary_c6_devkit]
board = esp32-c6-devkitc-1
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

[env:canary_c6_xiao]
board = seeed_xiao_esp32c6
board_build.partitions = default.csv

[env:canary_s3_devkit]
board = esp32-s3-devkitc-1
board_build.partitions = default.csv

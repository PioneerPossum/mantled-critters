; XIAO ESP32-S3 Sense crowd sensor. Build/flash with the venv in ~/magi-esp:
;   ~/magi-esp/venv/bin/pio run -d crowd-sense            (compile)
;   ~/magi-esp/venv/bin/pio run -d crowd-sense -t upload  (flash, board plugged in, ONLY after backing up the old firmware)
[env:xiao_s3_sense]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1

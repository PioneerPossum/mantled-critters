; magi ESP nodes: XIAO ESP32-S3 Sense camera (env:cam) and Waveshare ESP32-C6 LCD (env:lcd)
; Wi-Fi credentials are NOT in this repo: scripts/secrets.py injects them from ~/esp32-tools/wifi.secret at build time.
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/secrets.py

[env:cam]
board = seeed_xiao_esp32s3
build_src_filter = -<*> +<cam/>
board_build.partitions = default_8MB.csv
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1

[env:lcd]
board = esp32-c6-devkitc-1
build_src_filter = -<*> +<lcd/>
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  moononournation/GFX Library for Arduino@^1.6.0

[env:probe]
board = seeed_xiao_esp32c6
build_src_filter = -<*> +<probe/>
board_build.partitions = default.csv
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=0

[env:pair_xiao]
board = seeed_xiao_esp32c6
build_src_filter = -<*> +<pair/>
board_build.partitions = default.csv
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=0

[env:pair_devkit]
board = esp32-c6-devkitc-1
build_src_filter = -<*> +<pair/>
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=0

[env:mesh_xiao]
board = seeed_xiao_esp32c6
build_src_filter = -<*> +<mesh/>
board_build.partitions = default.csv
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=0

[env:mesh_devkit]
board = esp32-c6-devkitc-1
build_src_filter = -<*> +<mesh/>
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DHAS_UART0
  -DCORE_DEBUG_LEVEL=0

[env:sense_xiao]
board = seeed_xiao_esp32c6
build_src_filter = -<*> +<mesh/>
board_build.partitions = huge_app.csv
lib_deps = h2zero/NimBLE-Arduino@^2.1.0
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DWITH_BLE
  -DCORE_DEBUG_LEVEL=0

[env:sense_devkit]
board = esp32-c6-devkitc-1
build_src_filter = -<*> +<mesh/>
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
lib_deps = h2zero/NimBLE-Arduino@^2.1.0
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DHAS_UART0
  -DWITH_BLE
  -DCORE_DEBUG_LEVEL=0
